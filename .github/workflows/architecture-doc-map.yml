name: Architecture map verification

on:
  push:
    branches:
      - docs/full-app-architecture-map

permissions:
  contents: write

jobs:
  verify-doc-map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/full-app-architecture-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply consistency updates
        run: node scripts/apply_architecture_doc_consistency.mjs
      - name: Validate architecture JSON
        run: node -e "JSON.parse(require('fs').readFileSync('docs/architecture/workflow-map.json','utf8')); console.log('workflow-map.json valid')"
      - name: Validate canonical references
        shell: bash
        run: |
          grep -q 'docs/architecture/APP_WORKFLOW_MAP.md' README.md
          grep -q 'docs/architecture/APP_WORKFLOW_MAP.md' AGENTS.md
          grep -q 'Architecture Map Sync' AGENTS.md
          grep -q 'Established the canonical full-application architecture baseline' AGENT_EVOLUTION_LOG.md
          grep -q 'All current hosted task profiles use the maximum supported `high` thinking level' docs/AI_QUALITY.md
          grep -q 'This document describes \*\*what QuizMoKo is and how it currently works\*\*' docs/architecture/APP_WORKFLOW_MAP.md
      - name: Diff sanity
        run: git diff --check
      - name: Commit final documentation
        shell: bash
        run: |
          rm -f scripts/apply_architecture_doc_consistency.mjs .github/workflows/architecture-doc-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize canonical QuizMoKo architecture map"
          git push origin HEAD:docs/full-app-architecture-map
