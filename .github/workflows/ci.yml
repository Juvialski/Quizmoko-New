name: QuizMoKo CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Includes TypeScript, HTTP/security, durability, PDF, EJS/JS/CSS,
      # worksheet/grading contracts and mocked AI corpus regression.
      - run: npm test
      - run: npm run build
      - run: npm run eval:ai -- --output=ai-baseline.json
      - name: Classify dependency vulnerabilities
        run: |
          npm audit --json > audit.json || test -s audit.json
          node scripts/classify-dependency-audit.mjs audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-and-audit
          path: |
            ai-baseline.json
            audit.json
