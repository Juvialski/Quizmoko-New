name: QuizMoKo CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # R2 comparison loads the pinned R1 verifier from Git.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Includes TypeScript, HTTP/security, durability, PDF, EJS/JS/CSS,
      # worksheet/grading contracts and mocked AI corpus regression.
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run eval:ai -- --output=ai-baseline.json
      - run: npm run eval:r2 -- --output=r2-comparison.json
      - run: npm run eval:r3:grading -- --output=r3-grading.json
      - run: npm run eval:r3:diagrams -- --output=r3-diagrams.json
      - name: Classify dependency vulnerabilities
        run: |
          npm audit --json > audit.json || test -s audit.json
          node scripts/classify-dependency-audit.mjs audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-and-audit
          path: |
            ai-baseline.json
            r2-comparison.json
            r3-grading.json
            r3-grading.md
            r3-diagrams.json
            r3-diagrams.md
            audit.json
            docs/r4-browser/
            docs/r4-1-browser/
            docs/r4-2-browser/
