name: PR1 review fix verification

on:
  push:
    branches:
      - codex/worksheet-source-number-preservation

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/worksheet-source-number-preservation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply review fixes
        run: node scripts/apply_pr1_review_fixes.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint changed EJS templates
        run: npx ejslint views/worksheet_upload.ejs views/worksheet_answers_upload.ejs views/worksheet.ejs
      - name: Commit verified fixes
        shell: bash
        run: |
          rm -f scripts/apply_pr1_review_fixes.mjs .github/workflows/pr1-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining worksheet source identity edge cases"
          git push origin HEAD:codex/worksheet-source-number-preservation
